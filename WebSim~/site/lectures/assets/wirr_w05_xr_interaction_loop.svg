<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Pętla interakcji człowiek–system w XR</title>
  <desc id="figure-description">Diagram sześciu etapów interakcji w XR: użytkownik, sensory, interpretacja intencji, stan świata z czasem, weryfikacja oraz akcja. Nieaktualne dane powodują blokadę, a wykonana akcja generuje sprzężenie zwrotne.</desc>
  <metadata>WiRR W05, wykład 5, schemat „Pętla interakcji uwzględnia stan świata”. Opracowanie wektorowe na podstawie koncepcji z wykładu. Oryginalna osobna ilustracja BioRender: https://app.biorender.com/illustrations/ba6519ba27a2aa99a52d1bfa?slideId=0618a863-7f02-5d16-cf68-927dc2a293f6 . Niniejszy SVG jest odtworzeniem koncepcyjnym, a nie eksportem oryginalnego pliku BioRender.</metadata>
