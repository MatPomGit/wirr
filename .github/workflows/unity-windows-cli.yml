name: Unity Windows CLI acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unity-cli:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, X64, andromeda]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Unity CLI EditMode and PlayMode tests
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\tools\unity-ci\run-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Unity tests failed' }
      - name: Preserve machine-readable results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-windows-cli-${{ github.run_number }}
          path: artifacts/unity-native/
          if-no-files-found: warn
          retention-days: 14
