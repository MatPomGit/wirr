name: Validate WiRR report contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts~/wirr_integrity_screen.py'
      - 'scripts~/test_wirr_integrity_screen.py'
      - '.github/workflows/wirr-report-contract-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts~/wirr_integrity_screen.py'
      - 'scripts~/test_wirr_integrity_screen.py'
      - '.github/workflows/wirr-report-contract-tests.yml'

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test report integrity and exporter failure recovery
        run: python3 -m unittest discover -s scripts~ -p 'test_wirr*.py' -v
