name: Wydanie WiRR

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Walidacja i publikacja wydania
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sprawdź metadane pakietu
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(".")
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          version = package["version"].strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Nieprawidłowa stabilna wersja SemVer: {version}")

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          if f"## {version} (" not in changelog:
              raise SystemExit(f"Brak sekcji {version} w CHANGELOG.md")

          required = [
              "Editor",
              "Runtime",
              "Samples~",
              "Textures",
              "package.json",
              "README.md",
              "CHANGELOG.md",
              "LICENSE",
              "RoboAnimation.unitypackage",
              "RoboAnimation.unitypackage.meta",
          ]
          missing = [path for path in required if not (root / path).exists()]
          if missing:
              raise SystemExit("Brak wymaganych elementów pakietu: " + ", ".join(missing))

          texture_root = root / "Textures" / "Grid"
          texture_prefixes = ("grid-1", "grid_2", "grid-4")
          texture_suffixes = ("albedo", "ambient", "displacement", "normal", "specular")
          for prefix in texture_prefixes:
              for suffix in texture_suffixes:
                  texture = texture_root / f"{prefix}_{suffix}.png"
                  meta = texture_root / f"{prefix}_{suffix}.png.meta"
                  if not texture.is_file() or not meta.is_file():
                      raise SystemExit(f"Brak tekstury Grid lub pliku meta: {texture}")

          for editor_file in (
              "WiRRPrefabTextureLibrary.cs",
              "WiRRPrefabTools.cs",
              "WiRRSurfaceTextureLibrary.cs",
              "WiRROptionalPrefabTools.cs",
              "WiRRDynamicPrefabTools.cs",
              "WiRRAdditionalModelTools.cs",
              "WiRRHdriTools.cs",
              "WiRRBuildGuideWindow.cs",
              "WiRRXrShowcaseTools.cs",
              "WiRROnboarding.cs",
          ):
              source = root / "Editor" / editor_file
              meta = root / "Editor" / f"{editor_file}.meta"
              if not source.is_file() or not meta.is_file():
                  raise SystemExit(f"Brak narzędzia prefabów lub pliku meta: {source}")

          surface_root = root / "Textures" / "Surfaces"
          required_surface_families = (
              "AcousticFoam",
              "Concrete",
              "DiamondPlate",
              "Fabric023",
              "Fabric066",
              "Metal004",
              "Metal044A",
              "PaintedWood",
              "Sign",
              "Grass001",
              "WoodFloor034",
              "WoodFloor040",
          )
          for family in required_surface_families:
              folder = surface_root / family
              if not folder.is_dir():
                  raise SystemExit(f"Brak rodziny materiałów PBR: {family}")
              files = [path.name for path in folder.iterdir() if path.is_file()]
              if not any("_Color." in name for name in files):
                  raise SystemExit(f"Brak mapy Color dla {family}")
              if not any("_NormalGL." in name for name in files):
                  raise SystemExit(f"Brak mapy NormalGL dla {family}")
              if not any("_Roughness." in name for name in files):
                  raise SystemExit(f"Brak mapy Roughness dla {family}")

          if not (root / "THIRD_PARTY_TEXTURES.md").is_file():
              raise SystemExit("Brak THIRD_PARTY_TEXTURES.md")

          required_docs = (
              root / "Documentation~" / "Reference" / "EXTRA_ASSETS.md",
              root / "Documentation~" / "Reference" / "BUILD_AND_DEPLOY.md",
              root / "Documentation~" / "Reference" / "XR_SHOWCASE.md",
              root / "Textures" / "HDRI" / "README.md",
          )
          for document in required_docs:
              if not document.is_file():
                  raise SystemExit(f"Brak wymaganej dokumentacji: {document}")

          hdri_root = root / "Textures" / "HDRI"
          required_hdri = {
              "Amsterdam": "DayEnvironmentHDRI101_2K_HDR.exr",
              "CleanHorizon": "DaySkyHDRI006B_2K_HDR.exr",
              "DaySky": "DaySkyHDRI046A_2K_HDR.exr",
              "EveningEnvironment": "EveningEnvironmentHDRI003_2K_HDR.exr",
              "Forrest": "DayEnvironmentHDRI078_2K_HDR.exr",
              "IndoorEnvironment": "IndoorEnvironmentHDRI012_2K_HDR.exr",
              "NearLake": "DayEnvironmentHDRI096_2K_HDR.exr",
              "NightSky": "NightSkyHDRI008_2K_HDR.exr",
              "Tower": "DaySkyHDRI039A_2K_HDR.exr",
          }
          for folder, filename in required_hdri.items():
              hdri = hdri_root / folder / filename
              if not hdri.is_file() or hdri.stat().st_size < 1_000_000:
                  raise SystemExit(f"Brak lub nieprawidłowy plik HDRI: {hdri}")

          if len(list(hdri_root.glob("*/*_HDR.exr"))) != 9:
              raise SystemExit("Oczekiwano dokładnie 9 panoram HDRI EXR.")

          runtime_dynamic_files = (
              "WiRRLoopMotion.cs",
              "WiRRPhysicsImpulsePad.cs",
              "WiRRProceduralAudio.cs",
              "WiRRVehicleController.cs",
              "WiRRHeadParallax.cs",
              "WiRRGazeBloom.cs",
              "WiRRTelekinesisOrb.cs",
              "WiRRHeadFollower.cs",
              "WiRRProximityScale.cs",
          )
          for runtime_file in runtime_dynamic_files:
              source = root / "Runtime" / runtime_file
              meta = root / "Runtime" / f"{runtime_file}.meta"
              if not source.is_file() or not meta.is_file():
                  raise SystemExit(f"Brak dynamicznego komponentu Runtime lub pliku meta: {source}")

          showcase_source = (root / "Editor" / "WiRRXrShowcaseTools.cs").read_text(encoding="utf-8")
          if showcase_source.count("new Definition(") != 5:
              raise SystemExit("XR Showcase nie zawiera dokładnie pięciu demonstratorów.")

          xr_runtime_expectations = {
              "WiRRHeadParallax.cs": ("Recenter()",),
              "WiRRGazeBloom.cs": ("SetExternalActivation(float value)", "ClearExternalActivation()"),
              "WiRRTelekinesisOrb.cs": ("BeginHold()", "Release()", "ToggleHold()"),
              "WiRRHeadFollower.cs": ("Pin()", "Unpin()", "TogglePin()"),
              "WiRRProximityScale.cs": ("SetExternalFactor(float value)", "UseProximity()"),
          }
          for filename, signatures in xr_runtime_expectations.items():
              source_text = (root / "Runtime" / filename).read_text(encoding="utf-8")
              for signature in signatures:
                  if signature not in source_text:
                      raise SystemExit(f"Brak API XR w {filename}: {signature}")

          runtime_asmdef = json.loads(
              (root / "Runtime" / "KIA.WiRR.Runtime.asmdef").read_text(encoding="utf-8")
          )
          if "Unity.InputSystem" not in runtime_asmdef.get("references", []):
              raise SystemExit("Runtime asmdef nie odwołuje się do Unity.InputSystem")

          if package.get("dependencies", {}).get("com.unity.inputsystem") is None:
              raise SystemExit("package.json nie deklaruje zależności com.unity.inputsystem")

          samples = package.get("samples", [])
          if len(samples) != 7:
              raise SystemExit(f"Oczekiwano 7 próbek laboratoriów, znaleziono: {len(samples)}")

          checkpoints = ("3.0", "3.5", "4.0", "4.5", "5.0")
          task_source = (root / "Editor" / "WiRRLabTaskCatalog.cs").read_text(encoding="utf-8")
          table_source = (root / "Editor" / "WiRRReportTableCatalog.cs").read_text(encoding="utf-8")
          schema_source = (root / "Editor" / "WiRRReportSchemaCatalog.cs").read_text(encoding="utf-8")

          if task_source.count("new WiRRLabTask(") != 35:
              raise SystemExit("Katalog zadań nie zawiera dokładnie 7 × 5 checkpointów.")

          for checkpoint in checkpoints:
              if task_source.count(f'new WiRRLabTask("{checkpoint}"') != 7:
                  raise SystemExit(f"Niespójny katalog zadań dla checkpointu {checkpoint}.")
              if table_source.count(f'"{checkpoint}" =>') != 7:
                  raise SystemExit(f"Niespójny katalog tabel pomiarowych dla checkpointu {checkpoint}.")
              if schema_source.count(f', "{checkpoint}",') != 7:
                  raise SystemExit(f"Niespójny schemat raportów dla checkpointu {checkpoint}.")

          for number, sample in enumerate(samples, 1):
              expected_prefix = f"Laboratorium {number:02d}:"
              name = sample.get("displayName", "")
              path = sample.get("path", "")
              if not name.startswith(expected_prefix):
                  raise SystemExit(f"Niespójna nazwa próbki {number}: {name}")
              sample_root = root / path
              if not sample_root.exists():
                  raise SystemExit(f"Brak katalogu próbki: {path}")
              guide = (sample_root / "README.md").read_text(encoding="utf-8")
              for checkpoint in checkpoints:
                  if f"### {checkpoint}" not in guide:
                      raise SystemExit(f"Brak checkpointu {checkpoint} w instrukcji próbki Lab {number:02d}.")

          Path("release-version.txt").write_text(version, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          print(f"Pakiet WiRR {version}: metadane poprawne.")
          PY

      - name: Sprawdź skrypt walidatora raportów
        run: python3 -m py_compile scripts~/wirr_grade_report.py

      - name: Przetestuj punktację SSQ
        run: node --test WebSim~/tests/*.test.mjs

      - name: Sprawdź kod strony WebSim
        run: |
          set -euo pipefail
          test -s WebSim~/site/index.html
          test -s WebSim~/site/styles.css
          node --check WebSim~/site/app.mjs

      - name: Przygotuj informacje o wydaniu
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          match = re.search(
              rf"^## {re.escape(version)} \(.*?\)\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"Nie można wyodrębnić informacji o wydaniu {version}.")

          body = match.group("body").strip()
          notes = f"""# WiRR {version}

          Stabilne wydanie pakietu dydaktycznego WiRR dla Unity 6000.6.x.

          ## Instalacja z tego wydania

          W Unity Package Manager wybierz **Install package from git URL...** i użyj:

          `https://github.com/KIA-students/wirr.git#{tag}`

          ## Strona kursu

          https://kia-students.github.io/wirr/

          ## Najważniejsze zmiany

          {body}

          ## Weryfikacja wydania

          Przed publikacją automatycznie sprawdzono:
          - spójność `package.json` i `CHANGELOG.md`;
          - obecność wszystkich siedmiu próbek laboratoriów;
          - składnię walidatora raportów;
          - testy punktacji SSQ;
          - składnię aplikacji WebSim;
          - obecność dziewięciu panoram HDRI oraz instrukcji skybox;
          - obecność wbudowanej instrukcji budowania PC / Android / Quest 3;
          - komplet pięciu demonstratorów XR oraz ich skryptów Runtime i publicznego API integracyjnego.

          Archiwa dołączone do wydania zawierają pakiet UPM oraz sumy kontrolne SHA-256.
          """
          Path("release-notes.md").write_text(
              "\n".join(line.strip() for line in notes.strip().splitlines()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Zbuduj archiwa wydania
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          DIST="dist"
          STAGE="$DIST/wirr-$VERSION"
          mkdir -p "$STAGE"

          items=(
            Editor
            Runtime
            Samples~
            Textures
            Documentation~
            WebSim~
            scripts~
            package.json
            package.json.meta
            README.md
            README.md.meta
            CHANGELOG.md
            CHANGELOG.md.meta
            LICENSE
            LICENSE.meta
            THIRD_PARTY_TEXTURES.md
            .icon.png
            .icon.png.meta
            icon.png
            icon.png.meta
            icon.ico
            icon.ico.meta
            RoboAnimation.unitypackage
            RoboAnimation.unitypackage.meta
          )

          for item in "${items[@]}"; do
            if [ -e "$item" ]; then
              cp -a "$item" "$STAGE/"
            fi
          done

          tar -C "$DIST" -czf "$DIST/wirr-$VERSION.tgz" "wirr-$VERSION"
          (
            cd "$DIST"
            zip -qr "wirr-$VERSION.zip" "wirr-$VERSION"
          )
          sha256sum "$DIST/wirr-$VERSION.tgz" "$DIST/wirr-$VERSION.zip" > "$DIST/SHA256SUMS.txt"

      - name: Zachowaj artefakty CI
        uses: actions/upload-artifact@v4
        with:
          name: wirr-${{ steps.metadata.outputs.version }}
          path: |
            dist/wirr-${{ steps.metadata.outputs.version }}.tgz
            dist/wirr-${{ steps.metadata.outputs.version }}.zip
            dist/SHA256SUMS.txt
            release-notes.md
          if-no-files-found: error

      - name: Opublikuj GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — pomijam ponowną publikację."
            exit 0
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "WiRR $TAG"             --notes-file release-notes.md             "dist/wirr-$VERSION.tgz"             "dist/wirr-$VERSION.zip"             "dist/SHA256SUMS.txt"
