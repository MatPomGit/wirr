name: Deploy WebSim Pages

on:
  pull_request:
    paths:
      - 'WebSim~/site/**'
      - 'WebSim~/tests/**'
      - '.github/workflows/deploy-websim-pages.yml'
  push:
    branches: [main]
    paths:
      - 'WebSim~/site/**'
      - 'WebSim~/tests/**'
      - '.github/workflows/deploy-websim-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: websim-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test SSQ scoring
        run: node --test WebSim~/tests/*.test.mjs
      - name: Validate static site
        run: |
          test -s WebSim~/site/index.html
          grep -q 'WiRR WebSim' WebSim~/site/index.html
          node --check WebSim~/site/app.mjs
          test -s WebSim~/site/styles.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: WebSim~/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

