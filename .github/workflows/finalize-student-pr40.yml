name: Finalize approved WiRR student sync PR 40
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-student-pr40.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    environment: student-package-publishing
    steps:
      - name: Merge verified public export once
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || { echo "::error::Missing KIA_STUDENTS_SYNC_TOKEN"; exit 1; }
          repo=KIA-students/wirr
          pr=40
          state="$(gh api "repos/$repo/pulls/$pr" --jq '.state')"
          if [[ "$state" == closed ]]; then
            merged="$(gh api "repos/$repo/pulls/$pr" --jq '.merged')"
            if [[ "$merged" == true ]]; then
              echo "PR #40 already merged"
              exit 0
            fi
            echo "::error::PR #40 closed without merging"
            exit 1
          fi
          head="$(gh api "repos/$repo/pulls/$pr" --jq '.head.sha')"
          base="$(gh api "repos/$repo/pulls/$pr" --jq '.base.ref')"
          if [[ "$base" != main ]]; then
            echo "::error::PR #40 has unexpected target. Stop."
            exit 1
          fi
          changed="$(gh api "repos/$repo/pulls/$pr/files?per_page=100" --jq '[.[].filename] | sort | join(",")')"
          expected='Documentation~/Reference/FOUR_BLOCK_MISSIONS.md,Documentation~/Reference/UNITY_COURSE_JOURNEY.md,README.md,WebSim~/site/index.html'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected public files in PR #40; refusing merge"
            printf "%s\\n" "$changed"
            exit 1
          fi
          # The public export was sanitised by the upstream sync job.
          # Recheck the exact four-file allowlist against the current PR head.
          test -n "$head" || exit 1
          gh api --method PUT "repos/$repo/pulls/$pr/merge" -f sha="$head" -f merge_method=merge --jq '{merged,sha,message}'
          gh api "repos/$repo/pulls/$pr" --jq '{merged,merge_commit_sha,state}'
