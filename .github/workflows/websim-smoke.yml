name: WebSim smoke test

on:
  pull_request:
    paths:
      - 'WebSim~/**'
      - '.github/workflows/websim-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'WebSim~/**'
      - '.github/workflows/websim-smoke.yml'

permissions:
  contents: read

jobs:
  ros2-websim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build and start WebSim
        run: docker compose -f WebSim~/compose.yaml up --build -d

      - name: Verify ROS 2 session and JointState publication
        run: |
          set -euo pipefail
          docker compose -f WebSim~/compose.yaml exec -T websim bash -lc '
            source /opt/ros/jazzy/setup.bash
            for attempt in {1..20}; do
              ros2 topic list | grep -qx /wirr/status && break
              sleep 1
            done
            ros2 topic list | grep -qx /wirr/status

            # DDS discovery can lag immediately after container startup. Retry the
            # idempotent create command until the backend actually exposes the
            # session topic instead of assuming the first one-shot publication
            # was delivered.
            session_ready=0
            for attempt in {1..10}; do
              ros2 topic pub --once /wirr/control std_msgs/msg/String "{data: \"{\\\"session\\\":\\\"TEAMCI\\\",\\\"robot\\\":\\\"rrbot\\\",\\\"action\\\":\\\"create\\\",\\\"attempt\\\":$attempt}\"}" >/tmp/wirr-create.log 2>&1 || true

              for settle in {1..6}; do
                if ros2 topic list | grep -qx /wirr/TEAMCI/joint_states; then
                  session_ready=1
                  break
                fi
                sleep 0.5
              done

              [ "$session_ready" -eq 1 ] && break
            done

            if [ "$session_ready" -ne 1 ]; then
              cat /tmp/wirr-create.log || true
              echo "TEAMCI session was not created after retries" >&2
              exit 1
            fi

            joint_state="$(timeout 10 ros2 topic echo --once /wirr/TEAMCI/joint_states sensor_msgs/msg/JointState)"
            grep -q "joint1" <<< "$joint_state"
            grep -q "joint2" <<< "$joint_state"
          '

      - name: Show logs on failure
        if: failure()
        run: docker compose -f WebSim~/compose.yaml logs --no-color

      - name: Stop WebSim
        if: always()
        run: docker compose -f WebSim~/compose.yaml down --volumes
