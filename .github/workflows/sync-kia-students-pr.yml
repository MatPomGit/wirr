name: Synchronizacja do KIA-students

on:
  push:
    branches: [main]
  # Changes are exported after an actual main update; no periodic polling.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wirr-sync-to-kia-students
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: KIA-students/wirr
  UPSTREAM_BRANCH: main
  EXPORT_BRANCH: sync/public-main

jobs:
  sync-pr:
    if: github.repository == 'MatPomGit/wirr'
    name: Przygotuj bezpieczny eksport i Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repozytorium źródłowe
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skonfiguruj Git i pobierz repozytorium publiczne
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Usuń przestarzałe gałęzie robocze
        shell: bash
        run: |
          set -euo pipefail
          for branch in lab01-start release/1.0.0-polish; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Usuwam przestarzałą gałąź: ${branch}"
              git push origin --delete "${branch}"
            fi
          done

      - name: Sprawdź gotowość uwierzytelnienia
        id: auth
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Brak sekretu KIA_STUDENTS_SYNC_TOKEN. Automatyczne porządkowanie PR-ów i publikacja zmian są wyłączone."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Opublikuj lekką gałąź UPM
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_root="${GITHUB_WORKSPACE}"
          stage="${RUNNER_TEMP}/wirr-upm"
          rm -rf "${stage}"
          mkdir -p "${stage}"

          # Pakiet instalacyjny zawiera kod, próbki, dokumentację i lekkie zasoby.
          # Ciężki projekt deweloperski oraz opcjonalne HDRI/PBR nie są pobierane
          # przy zwykłej instalacji przez Unity Package Manager.
          for path in             Editor Runtime Samples~ Documentation~ WebSim~ scripts~             package.json package.json.meta             README.md README.md.meta             CHANGELOG.md CHANGELOG.md.meta             LICENSE LICENSE.meta             THIRD_PARTY_TEXTURES.md             .icon.png .icon.png.meta icon.png icon.png.meta icon.ico icon.ico.meta             RoboAnimation.unitypackage RoboAnimation.unitypackage.meta             Editor.meta Runtime.meta Textures.meta; do
            if [ -e "${source_root}/${path}" ]; then
              cp -a "${source_root}/${path}" "${stage}/"
            fi
          done

          mkdir -p "${stage}/Textures"
          cp -a "${source_root}/Textures/Grid" "${stage}/Textures/"
          cp -a "${source_root}/Textures/Grid.meta" "${stage}/Textures/"

          # Kontrola, że ciężkie katalogi nie trafiły do szybkiej dystrybucji.
          test ! -e "${stage}/Project~"
          test ! -e "${stage}/Textures/HDRI"
          test ! -e "${stage}/Textures/Surfaces"

          # Gałąź upm jest publikowana w repozytorium źródłowym MatPomGit/wirr,
          # więc jej własny adres instalacyjny jest dozwolony. Kontrola odwołań
          # MatPomGit pozostaje niżej dla sanitizowanego eksportu do KIA-students.

          python3 - "${stage}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          labs = [
              item for item in package.get("samples", [])
              if str(item.get("displayName", "")).startswith("Laboratorium ")
          ]
          if len(labs) != 8:
              raise SystemExit(f"UPM: oczekiwano 8 laboratoriów, znaleziono {len(labs)}")
          if not any(item.get("displayName") == "VITURE XR: Full SBS i Immersive 3D"
                     for item in package.get("samples", [])):
              raise SystemExit("UPM: brak sample VITURE XR")
          for required in ("Editor", "Runtime", "Samples~", "Documentation~", "Textures/Grid"):
              if not (root / required).exists():
                  raise SystemExit(f"UPM: brak {required}")
          PY

          size_mb="$(du -sm "${stage}" | awk '{print $1}')"
          echo "Lekki snapshot UPM: ${size_mb} MB"

          (
            cd "${stage}"
            git init -q
            git checkout -q --orphan upm
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "upm: lekki snapshot WiRR"
            # Gałąź UPM jest artefaktem dystrybucyjnym repozytorium źródłowego.
            # Nie wymaga uprawnień zapisu do KIA-students/wirr. Publiczna zawartość
            # repozytorium kursu jest aktualizowana osobno przez sanitizowany PR.
            git remote add source "https://x-access-token:${SOURCE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force source HEAD:refs/heads/upm
          )

          {
            echo "## Lekka dystrybucja UPM"
            echo
            echo "- gałąź: `${GITHUB_REPOSITORY}#upm`"
            echo "- rozmiar snapshotu roboczego: ${size_mb} MB"
            echo "- pominięto: `Project~`, `Textures/HDRI`, `Textures/Surfaces`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Zamknij bezpośrednie PR-y z gałęzi main
        if: steps.auth.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t legacy_open_prs < <(
            gh api --method GET "repos/${UPSTREAM_REPOSITORY}/pulls" \
              -f state=open \
              -f base="${UPSTREAM_BRANCH}" \
              -f head="MatPomGit:main" \
              --jq '.[].number'
          )

          for pr_number in "${legacy_open_prs[@]}"; do
            [ -n "${pr_number}" ] || continue
            gh pr close "${pr_number}" \
              --repo "${UPSTREAM_REPOSITORY}" \
              --comment "Ten PR omija sanitizowany eksport. Publiczne zmiany są publikowane wyłącznie z gałęzi sync/public-main."
          done

      - name: Zbuduj publiczny snapshot
        id: export
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          {
            echo "source_sha=${source_sha}"
            echo "upstream_sha=${upstream_sha}"
          } >> "${GITHUB_OUTPUT}"

          private_paths=(
            ".github/workflows/sync-kia-students-pr.yml"
            ".github/workflows/publish-student-upm.yml"
            ".github/workflows/wirr-approved-points.yml"
            ".github/workflows/sync-from-kia-students.yml"
            ".github/workflows/branch-hygiene.yml"
            ".github/workflows/finalize-student-pr40.yml"
            ".github/workflows/cleanup-course-league.yml"
          )

          git checkout -B "${EXPORT_BRANCH}" "upstream/${UPSTREAM_BRANCH}"
          git read-tree --reset -u "${source_sha}"

          # The competition scoreboard belongs to the COURSE repository, not
          # to this development snapshot. Keep all already approved scores.
          # An initial scoreboard is exported only if the course has none yet.
          if git ls-tree -r --name-only "upstream/${UPSTREAM_BRANCH}" -- competition \
               | grep -q '^competition/'; then
            git checkout "upstream/${UPSTREAM_BRANCH}" -- competition
            echo "Zachowano aktualny ranking studentów z KIA-students/wirr."
          fi

          for path in "${private_paths[@]}"; do
            git rm -f --ignore-unmatch -- "${path}"
          done

          for path in "${private_paths[@]}"; do
            if [ -e "${path}" ]; then
              echo "::error::Prywatny workflow pozostał w eksporcie: ${path}"
              exit 1
            fi
          done

          forbidden_matches="$(
            grep -RInE               --exclude-dir=.git               --binary-files=without-match               'MatPomGit'               . || true
          )"

          if [ -n "${forbidden_matches}" ]; then
            echo "::error::Eksport zawiera niedozwolone odwołania do repozytoriów roboczych."
            printf '%s\n' "${forbidden_matches}"
            {
              echo "## Eksport wstrzymany"
              echo
              echo "W publicznym snapshotcie wykryto odwołania, które nie powinny być publikowane."
              printf '%s\n' "${forbidden_matches}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          # Te same kontrole publicznej konfiguracji, które wykonuje
          # .github/workflows/public-content-safety.yml w repozytorium kursu.
          grep -q '"documentationUrl": "https://kia-students.github.io/wirr/"' package.json
          grep -q 'https://github.com/KIA-students/wirr.git' README.md
          grep -q 'https://kia-students.github.io/wirr/' README.md

          if git diff --cached --quiet HEAD --; then
            echo "needs_pr=false" >> "${GITHUB_OUTPUT}"
            echo "Brak różnic w publicznej zawartości."
            exit 0
          fi

          # Nie zmieniaj SHA otwartego PR, jeśli sanitizowana treść jest identyczna.
          # Dzięki temu prywatne zmiany workflow w repozytorium źródłowym nie
          # resetują już zatwierdzonych kontroli publicznego snapshotu.
          if git ls-remote --exit-code --heads origin "refs/heads/${EXPORT_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "refs/heads/${EXPORT_BRANCH}:refs/remotes/origin/${EXPORT_BRANCH}"
            prospective_tree="$(git write-tree)"
            existing_export_sha="$(git rev-parse "refs/remotes/origin/${EXPORT_BRANCH}")"
            existing_tree="$(git rev-parse "${existing_export_sha}^{tree}")"

            if [ "${prospective_tree}" = "${existing_tree}" ]; then
              {
                echo "needs_pr=true"
                echo "export_sha=${existing_export_sha}"
              } >> "${GITHUB_OUTPUT}"
              echo "Sanitizowany snapshot jest identyczny; zachowano istniejący SHA ${existing_export_sha:0:12}."
              exit 0
            fi
          fi

          git commit -m "sync: aktualizacja publicznego pakietu WiRR"
          export_sha="$(git rev-parse HEAD)"

          git push --force origin "HEAD:refs/heads/${EXPORT_BRANCH}"

          {
            echo "needs_pr=true"
            echo "export_sha=${export_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Publiczny eksport WiRR"
            echo
            echo "Przygotowano sanitizowany snapshot przeznaczony do repozytorium kursu."
            echo
            echo "- pliki prywatnej automatyzacji: wykluczone"
            echo "- odwołania do repozytoriów roboczych: brak"
            echo "- commit eksportowy: ${export_sha:0:12}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Brak zmian do publikacji
        if: steps.export.outputs.needs_pr != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Publiczna zawartość jest już zgodna z KIA-students/wirr."
          if git ls-remote --exit-code --heads origin "refs/heads/${EXPORT_BRANCH}" >/dev/null 2>&1; then
            echo "Usuwam niepotrzebną gałąź eksportową: ${EXPORT_BRANCH}"
            git push origin --delete "${EXPORT_BRANCH}"
          fi

      # Do not rebase or force-push source main to the public repository.
      # Ahead/behind includes intentionally private CI and independent export history.
      # The source remains authoritative; public changes flow through reviewed PRs.

      - name: Oczyść metadane starszych Pull Requestów
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t public_metadata_prs < <(
            gh pr list               --repo "${UPSTREAM_REPOSITORY}"               --state all               --limit 100               --json number,title               --jq '.[] | select(.title | contains("MatPomGit/wirr")) | .number'
          )

          for pr_number in "${public_metadata_prs[@]}"; do
            [ -n "${pr_number}" ] || continue
            gh pr edit "${pr_number}"               --repo "${UPSTREAM_REPOSITORY}"               --title "archiwalna synchronizacja WiRR"               --body "Archiwalny Pull Request mechanizmu synchronizacji. Zastąpiony przez sanitizowany eksport publicznej zawartości WiRR Course Toolkit."
          done

      - name: Sprawdź istniejący Pull Request
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          existing_url="$(
            gh api --method GET "repos/${UPSTREAM_REPOSITORY}/pulls"               -f state=open               -f base="${UPSTREAM_BRANCH}"               -f head="MatPomGit:${EXPORT_BRANCH}"               --jq '.[0].html_url // ""'
          )"

          existing_number="$(
            gh api --method GET "repos/${UPSTREAM_REPOSITORY}/pulls"               -f state=open               -f base="${UPSTREAM_BRANCH}"               -f head="MatPomGit:${EXPORT_BRANCH}"               --jq '.[0].number // ""'
          )"

          echo "url=${existing_url}" >> "${GITHUB_OUTPUT}"
          echo "number=${existing_number}" >> "${GITHUB_OUTPUT}"

      - name: Utwórz Pull Request do repozytorium kursu
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true' && steps.existing.outputs.url == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          cat > sync-pr-body.md <<'EOF'
          Automatycznie przygotowana aktualizacja publicznego pakietu WiRR Course Toolkit.

          Snapshot został sprawdzony przed utworzeniem Pull Requestu:
          - nie zawiera workflow używanych wyłącznie do synchronizacji repozytoriów;
          - nie zawiera odwołań do repozytoriów roboczych;
          - zawiera wyłącznie publiczną postać pakietu kursu.

          Po scaleniu repozytorium KIA-students/wirr nie otrzymuje mechanizmów odpowiedzialnych za synchronizację.
          EOF

          pr_url="$(
            gh pr create               --repo "${UPSTREAM_REPOSITORY}"               --base "${UPSTREAM_BRANCH}"               --head "MatPomGit:${EXPORT_BRANCH}"               --title "sync: aktualizacja WiRR Course Toolkit"               --body-file sync-pr-body.md
          )"

          echo "Utworzono PR: ${pr_url}"
          echo "Pull Request: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Podsumuj istniejący Pull Request
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true' && steps.existing.outputs.url != ''
        shell: bash
        run: |
          echo "Zmiany są objęte istniejącym Pull Requestem: ${{ steps.existing.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Ostrzeż o odziedziczonej automatyzacji w repozytorium kursu
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true' && steps.existing.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          inherited=false
          private_checks=(
            ".github/workflows/sync-kia-students-pr.yml"
            ".github/workflows/publish-student-upm.yml"
            ".github/workflows/wirr-approved-points.yml"
            ".github/workflows/sync-from-kia-students.yml"
            ".github/workflows/branch-hygiene.yml"
            ".github/workflows/finalize-student-pr40.yml"
            ".github/workflows/cleanup-course-league.yml"
          )
          for path in "${private_checks[@]}"; do
            if gh api "repos/${UPSTREAM_REPOSITORY}/contents/${path}" >/dev/null 2>&1; then
              inherited=true
              break
            fi
          done

          if [ "${inherited}" = true ]; then
            echo "::warning::Repozytorium kursu nadal zawiera prywatne workflow. Scal sanitizowany Pull Request ${{ steps.existing.outputs.url }}."
            {
              echo "## Wymagane scalenie"
              echo
              echo "Repozytorium kursu nadal zawiera workflow, które powinny istnieć wyłącznie w repozytorium źródłowym."
              echo "Scal sanitizowany Pull Request: ${{ steps.existing.outputs.url }}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Repozytorium kursu nie zawiera prywatnej automatyzacji."
          fi

      - name: Scal sanitizowany Pull Request po pomyślnych kontrolach
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          pr_number="$(
            gh api --method GET "repos/${UPSTREAM_REPOSITORY}/pulls" \
              -f state=open \
              -f base="${UPSTREAM_BRANCH}" \
              -f head="MatPomGit:${EXPORT_BRANCH}" \
              --jq '.[0].number // ""'
          )"

          if [ -z "${pr_number}" ]; then
            echo "::error::Nie znaleziono sanitizowanego Pull Requestu do scalenia."
            exit 1
          fi

          checks_seen=false
          for attempt in {1..12}; do
            set +e
            checks_output="$(gh pr checks "${pr_number}" --repo "${UPSTREAM_REPOSITORY}" 2>&1)"
            set -e

            if printf '%s\n' "${checks_output}" | grep -qi 'no checks reported'; then
              sleep 5
              continue
            fi

            checks_seen=true
            break
          done

          if [ "${checks_seen}" != true ]; then
            echo "::error::GitHub nie zarejestrował kontroli PR #${pr_number}."
            exit 1
          fi

          gh pr checks "${pr_number}" \
            --repo "${UPSTREAM_REPOSITORY}" \
            --watch \
            --interval 10

          set +e
          merge_output="$(
            gh pr merge "${pr_number}" \
              --repo "${UPSTREAM_REPOSITORY}" \
              --squash \
              --delete-branch 2>&1
          )"
          merge_status=$?
          set -e

          if [ "${merge_status}" -ne 0 ]; then
            if printf '%s\n' "${merge_output}" | grep -qi 'Resource not accessible'; then
              echo "::warning::Token synchronizacji nie ma uprawnienia do scalenia PR #${pr_number}; PR pozostaje gotowy i zweryfikowany."
              {
                echo "## PR gotowy do scalenia"
                echo
                echo "Kontrole PR #${pr_number} przeszły, ale token synchronizacji nie ma uprawnienia `mergePullRequest`."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            printf '%s\n' "${merge_output}" >&2
            exit "${merge_status}"
          fi

          echo "Scalono sanitizowany PR #${pr_number} po zielonych kontrolach." >> "${GITHUB_STEP_SUMMARY}"
